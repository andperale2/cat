<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dango TV</title>
    <link rel="stylesheet" href="css/style.css">
    <script type="text/javascript" src="$WEBAPIS/webapis/webapis.js"></script>
</head>
<body>
    <div id="setup-container" class="container">
        <div class="card">
            <div class="logo-container">
                <h1 class="logo-title">dango TV</h1>
                <p class="subtitle">Conecta tu Samsung Smart TV a tu servidor dango</p>
            </div>

            <form id="connect-form" onsubmit="saveAndConnect(event)">
                <div class="form-group">
                    <label for="server-url">Dirección del Servidor dango:</label>
                    <input type="url" id="server-url" class="focusable" placeholder="http://192.168.1.X:3000" required autofocus />
                    <span class="help-text">Ingresa la IP local y puerto donde se ejecuta dango (ej. http://192.168.1.50:3000)</span>
                </div>

                <div class="button-group">
                    <button type="submit" id="btn-connect" class="btn btn-primary focusable">Conectar</button>
                    <button type="button" id="btn-reset" class="btn btn-secondary focusable" onclick="clearSettings()">Restablecer</button>
                </div>
            </form>
        </div>
    </div>

    <div id="webview-container" class="hidden">
        <iframe id="dango-frame" src="about:blank" allow="autoplay; fullscreen" frameborder="0"></iframe>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
