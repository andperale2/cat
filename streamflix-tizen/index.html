<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Streamflix TV</title>
    <link rel="stylesheet" type="text/css" href="css/style.css"/>
</head>
<body>
    <div id="app">
        <div class="sidebar">
            <div class="logo">
                <img src="icon.png" alt="Streamflix Logo">
            </div>
            <ul class="menu" id="menu">
                <li class="focusable" data-action="home">Home</li>
                <li class="focusable" data-action="movies">Movies</li>
                <li class="focusable" data-action="tvshows">TV Shows</li>
                <li class="focusable" data-action="search">Search</li>
                <li class="focusable" data-action="settings">Settings</li>
            </ul>
        </div>

        <div class="main-content">
            <h1 id="page-title">Home</h1>

            <div class="section-title">Trending Now</div>
            <div class="carousel" id="carousel-trending">
                <div class="item focusable" data-id="1">
                    <div class="placeholder-poster">Movie 1</div>
                </div>
                <div class="item focusable" data-id="2">
                    <div class="placeholder-poster">Movie 2</div>
                </div>
                <div class="item focusable" data-id="3">
                    <div class="placeholder-poster">Movie 3</div>
                </div>
                <div class="item focusable" data-id="4">
                    <div class="placeholder-poster">Movie 4</div>
                </div>
                <div class="item focusable" data-id="5">
                    <div class="placeholder-poster">Movie 5</div>
                </div>
            </div>

            <div class="section-title">Popular Series</div>
            <div class="carousel" id="carousel-popular">
                <div class="item focusable" data-id="6">
                    <div class="placeholder-poster">Show 1</div>
                </div>
                <div class="item focusable" data-id="7">
                    <div class="placeholder-poster">Show 2</div>
                </div>
                <div class="item focusable" data-id="8">
                    <div class="placeholder-poster">Show 3</div>
                </div>
                <div class="item focusable" data-id="9">
                    <div class="placeholder-poster">Show 4</div>
                </div>
                <div class="item focusable" data-id="10">
                    <div class="placeholder-poster">Show 5</div>
                </div>
            </div>
        </div>
    </div>

    <script type="text/javascript" src="js/main.js"></script>
</body>
</html>
