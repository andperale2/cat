<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kino-Light TV</title>
    <link rel="stylesheet" href="css/style.css">
    <script type="text/javascript" src="$WEBAPIS/webapis/webapis.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>
    <div id="main-app" class="app-layout">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="brand">
                <h2>KINO-LIGHT</h2>
            </div>
            <nav id="category-nav" class="nav-menu">
                <!-- Dynamic categories loaded here -->
            </nav>
        </aside>

        <!-- Main Content Area -->
        <main class="content-area">
            <header class="content-header">
                <h1 id="current-category-title">Catálogo</h1>
            </header>

            <section id="catalog-grid" class="catalog-grid">
                <!-- Dynamic media items cards -->
            </section>
        </main>
    </div>

    <!-- Item Detail View / Modal -->
    <div id="detail-modal" class="modal hidden">
        <div class="modal-content">
            <div id="detail-backdrop" class="detail-backdrop"></div>
            <div class="detail-body">
                <h1 id="detail-title">Cargando...</h1>
                <div class="detail-meta">
                    <span id="detail-year">2024</span> |
                    <span id="detail-rating">★ 8.5</span> |
                    <span id="detail-duration">120 min</span>
                </div>
                <p id="detail-synopsis" class="detail-synopsis"></p>

                <div class="detail-actions">
                    <button id="btn-play-now" class="btn btn-primary focusable">► Reproducir</button>
                    <button id="btn-close-detail" class="btn btn-secondary focusable">Volver</button>
                </div>

                <div id="episodes-container" class="episodes-container hidden">
                    <h3>Episodios</h3>
                    <div id="episodes-list" class="episodes-list"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Video Player Overlay -->
    <div id="player-container" class="player-container hidden">
        <video id="html5-video" class="hidden"></video>
        <div id="player-status" class="player-status"></div>
        <div id="player-controls" class="player-controls">
            <div class="player-header">
                <h2 id="player-title">Reproduciendo</h2>
            </div>
            <div class="player-progress-container">
                <div id="player-progress-bar" class="player-progress-bar"></div>
            </div>
            <div class="player-footer">
                <span id="player-time">0:00 / 0:00</span>
                <div class="player-buttons">
                    <button id="btn-rewind" class="btn btn-control focusable" onclick="player.seek(-10)">◄◄ 10s</button>
                    <button id="btn-play-pause" class="btn btn-control focusable" onclick="player.togglePlayPause()">❚❚ Pausa</button>
                    <button id="btn-ff" class="btn btn-control focusable" onclick="player.seek(10)">10s ►►</button>
                    <button id="btn-close-player" class="btn btn-control focusable" onclick="player.close()">⨉ Salir</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/services/kinoApi.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/player.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
